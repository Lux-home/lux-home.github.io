<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXHOME-NV</title>
<meta name="theme-color" content="#0e7ba8">
<link rel="manifest" href="manifest-nv.webmanifest">
<style>
  :root{ --bg:#eef3f4; --surface:#fff; --fg:#13242a; --muted:#5f727a; --line:#e2eaec; --cyan:#0e7ba8; --cyan2:#28c3dd; --gold:#d79f38; --green:#12a150; --red:#c0392b; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#0c1518; --surface:#13222a; --fg:#e8f1f3; --muted:#90a4ac; --line:#20333c; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"Be Vietnam Pro",system-ui,sans-serif;line-height:1.45}
  .top{background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 18px;text-align:center}
  .top .b{font-size:1.5rem;font-weight:800;letter-spacing:2px;color:#ffd977}
  .top .s{font-size:.82rem;opacity:.92;letter-spacing:.08em}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
  .lb{font-size:.78rem;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:1.05rem;background:var(--surface);color:var(--fg);margin-bottom:4px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:10px}
  .msg{font-size:.88rem;margin-top:10px;min-height:1.2em}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 14px;text-align:center;text-decoration:none;color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .tile .ic{font-size:2rem} .tile .tt{font-weight:800;margin-top:6px;font-size:1.05rem} .tile .ds{font-size:.78rem;color:var(--muted)}
  .who{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px}
  .who .n{font-weight:800} .who .r{font-size:.78rem;color:var(--muted)}
  .logout{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:.85rem}
  .locked{text-align:center;padding:30px 16px}
  .locked .ic{font-size:3rem}
</style>
</head>
<body>
<div class="top"><div class="b">LUXHOME</div><div class="s">ỨNG DỤNG NHÂN VIÊN</div></div>
<div class="wrap">

  <div id="login" class="card" style="display:none">
    <div class="lb">Mã nhân viên</div>
    <input type="text" id="l_ma" placeholder="VD: NV01" autocapitalize="characters" autocomplete="username">
    <div class="lb">Mật khẩu</div>
    <input type="password" id="l_pw" placeholder="Mật khẩu" autocomplete="current-password">
    <button class="btn" id="l_btn">Đăng nhập</button>
    <p class="msg" id="l_msg"></p>
  </div>

  <div id="home" style="display:none">
    <div class="who">
      <div><div class="n" id="w_name"></div><div class="r" id="w_role"></div></div>
      <button class="logout" id="btnout">Đăng xuất</button>
    </div>
    <div class="tiles" id="tiles" style="margin-top:14px"></div>
    <p class="msg" id="h_msg" style="text-align:center"></p>
  </div>

  <div id="blocked" class="card locked" style="display:none">
    <div class="ic">🔒</div>
    <h3 id="b_title">Tài khoản đã bị khoá</h3>
    <p class="msg err" id="b_msg">Vui lòng liên hệ quản lý.</p>
    <button class="btn" id="b_btn" style="background:#5d6b66">Đăng nhập lại</button>
  </div>

</div>

<script>
var EXEC="https://script.google.com/macros/s/AKfycbyFhO_xjflBHiofIY_XuQCcUNKd1VCwTUKhW5Jvaya51WBD5IId5owYfZM_Q9DY0aZoWQ/exec";
function enc(s){return encodeURIComponent(String(s));}
function api(qs){ return fetch(EXEC+'?'+qs+'&callback=cb&t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){ var i=t.indexOf('('),j=t.lastIndexOf(')'); return JSON.parse(t.slice(i+1,j)); }); }
var MODS={ bill:{ic:'🧾',tt:'Gửi hóa đơn',ds:'Gửi bill cho khách',href:'bill.html'}, luutru:{ic:'🛂',tt:'Lưu trú',ds:'Nhắc gia hạn lưu trú',href:'luutru.html'} };

function show(id){ ['login','home','blocked'].forEach(function(x){ document.getElementById(x).style.display = x===id?(x==='home'?'block':'block'):'none'; }); }
function tok(){ try{ return localStorage.getItem('nv_tok')||''; }catch(e){ return ''; } }
function setTok(t){ try{ if(t) localStorage.setItem('nv_tok',t); else localStorage.removeItem('nv_tok'); }catch(e){} }

function renderHome(me){
  document.getElementById('w_name').textContent = me.ten||me.ma;
  document.getElementById('w_role').textContent = 'Mã NV: '+me.ma;
  var perms = me.perms||[];
  var el=document.getElementById('tiles'); el.innerHTML='';
  perms.forEach(function(k){ var m=MODS[k]; if(!m) return;
    var a=document.createElement('a'); a.className='tile'; a.href=m.href+'?tok='+enc(tok());
    a.innerHTML='<div class="ic">'+m.ic+'</div><div class="tt">'+m.tt+'</div><div class="ds">'+m.ds+'</div>';
    el.appendChild(a);
  });
  if(!perms.length) document.getElementById('h_msg').textContent='Chưa được cấp quyền nào. Liên hệ quản lý.';
  else document.getElementById('h_msg').textContent='';
  show('home');
}

function checkMe(){
  var t=tok(); if(!t){ show('login'); return; }
  api('nvme=1&tok='+enc(t)).then(function(d){
    if(d&&d.ok){ renderHome(d); }
    else if(d&&d.locked){ document.getElementById('b_title').textContent='Tài khoản đã bị khoá'; document.getElementById('b_msg').textContent='Quản lý đã tạm khoá quyền truy cập.'; setTok(''); show('blocked'); }
    else { setTok(''); show('login'); }
  }).catch(function(){ show('login'); });
}

document.getElementById('l_btn').onclick=function(){
  var ma=document.getElementById('l_ma').value.trim(), pw=document.getElementById('l_pw').value;
  var m=document.getElementById('l_msg'); m.className='msg';
  if(!ma||!pw){ m.className='msg err'; m.textContent='Nhập đủ mã NV và mật khẩu.'; return; }
  m.textContent='Đang đăng nhập…';
  api('nvlogin=1&ma='+enc(ma)+'&nvpw='+enc(pw)).then(function(d){
    if(d&&d.ok){ setTok(d.tok); m.className='msg ok'; m.textContent='✓ Xin chào '+(d.ten||d.ma); renderHome(d); }
    else if(d&&d.locked){ m.className='msg err'; m.textContent='Tài khoản đã bị khoá. Liên hệ quản lý.'; }
    else { m.className='msg err'; m.textContent='Sai mã NV hoặc mật khẩu.'; }
  }).catch(function(){ m.className='msg err'; m.textContent='Không kết nối được.'; });
};
document.getElementById('btnout').onclick=function(){ setTok(''); show('login'); };
document.getElementById('b_btn').onclick=function(){ setTok(''); show('login'); };
document.getElementById('l_pw').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('l_btn').click(); });

checkMe();

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(function(reg){ reg.addEventListener('updatefound',function(){ var nw=reg.installing; if(!nw) return; nw.addEventListener('statechange',function(){ if(nw.state==='activated' && navigator.serviceWorker.controller && !window._had){ } }); }); }).catch(function(){}); var _r=false; navigator.serviceWorker.addEventListener('controllerchange',function(){ if(_r) return; _r=true; location.reload(); }); }
</script>
</body>
</html>
