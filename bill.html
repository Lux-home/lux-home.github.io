<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXHOME · Gửi hóa đơn</title>
<meta name="theme-color" content="#0e7ba8">
<style>
  :root{--bg:#eef3f4;--surface:#fff;--fg:#13242a;--muted:#5f727a;--line:#e2eaec;--cyan:#0e7ba8;--cyan2:#28c3dd;--red:#c0392b;--amber:#b7791f;}
  @media (prefers-color-scheme:dark){:root{--bg:#0c1518;--surface:#13222a;--fg:#e8f1f3;--muted:#90a4ac;--line:#20333c;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"Be Vietnam Pro",sans-serif;line-height:1.45}
  .top{background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 18px}
  .top a.back{color:#eafff8;text-decoration:none;font-size:.85rem;opacity:.9}
  .brand{font-size:1.4rem;font-weight:800;letter-spacing:2px;color:#ffd977;margin-top:4px}
  .brand small{display:block;font-size:.68rem;font-weight:600;letter-spacing:3px;color:#eafbff;margin-top:2px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 50px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
  .lb{font-weight:700;font-size:.88rem;margin:10px 0 4px}
  .hint{color:var(--muted);font-size:.82rem}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--fg)}
  .btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--cyan);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;margin-top:12px}
  .drop{border:2px dashed var(--cyan2);border-radius:14px;padding:22px 14px;text-align:center;background:rgba(40,195,221,.08);cursor:pointer;margin-top:6px;display:block}
  .drop b{color:var(--cyan)}
  .row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:10px}
  .row>img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}
  .info{flex:1;min-width:0}
  .ph{font-weight:800}
  .nm{color:var(--muted);font-size:.85rem;font-weight:400}
  .act a,.act button{display:inline-block;padding:8px 13px;border-radius:9px;font-weight:800;font-size:.84rem;text-decoration:none;cursor:pointer;border:1px solid}
  .za{color:#0068ff;border-color:#0068ff;background:transparent}
  .wa{color:#12a150;border-color:#12a150;background:transparent}
  .wc{color:#07a84e;border-color:#07a84e;background:transparent}
  .warn{color:var(--amber);background:rgba(183,121,31,.12);border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
  .vlink{font-size:.78rem}
  .err{color:var(--red);font-size:.85rem;margin-top:8px}
  .load{color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html">← Trang chính</a>
  <div class="brand">LUXHOME<small>GỬI HÓA ĐƠN / SEND INVOICES</small></div>
</div>
<div class="wrap">
  <div class="card" id="gate">
    <div class="lb">Mật khẩu quản lý</div>
    <input id="pw" type="password" placeholder="Nhập mật khẩu">
    <button class="btn" id="btnvao">Mở</button>
    <p class="err" id="gerr" style="display:none">Sai mật khẩu hoặc không kết nối được</p>
  </div>
  <div class="card" id="main" style="display:none">
    <div class="lb">Tháng hóa đơn</div>
    <input id="thang" placeholder="11-2026">
    <div class="lb">Nạp ảnh hóa đơn (tên file có mã phòng)</div>
    <label class="drop" for="file"><b>+ Chọn ảnh hóa đơn</b><div class="hint">Chọn nhiều ảnh cùng lúc · tên file chứa mã phòng (vd 101-T16)</div></label>
    <input id="file" type="file" accept="image/*" multiple style="display:none">
    <p class="hint" id="status" style="margin-top:10px"></p>
    <div id="list"></div>
  </div>
</div>

<script>
var EXEC="https://script.google.com/macros/s/AKfycbyFhO_xjflBHiofIY_XuQCcUNKd1VCwTUKhW5Jvaya51WBD5IId5owYfZM_Q9DY0aZoWQ/exec";
var PW='', CONTACTS=[];

function callExec(url, ok, fail){
  fetch(url,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
    var i=t.indexOf('('), j=t.lastIndexOf(')');
    if(i<0||j<=i){ fail&&fail(); return; }
    var d; try{ d=JSON.parse(t.slice(i+1,j)); }catch(e){ fail&&fail(); return; }
    ok&&ok(d);
  }).catch(function(){ fail&&fail(); });
}
function enc(s){return encodeURIComponent(String(s==null?'':s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function waNum(p){var d=String(p||'').replace(/[^0-9+]/g,'').replace(/^\+/,'');if(d.charAt(0)==='0')d='84'+d.slice(1);return d;}
function zaloNum(p){return String(p||'').replace(/[^0-9+]/g,'').replace(/^\+/,'');}
function cpy(t){ try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t); else { var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove(); } }catch(e){} }

function vao(){
  PW=document.getElementById('pw').value;
  document.getElementById('gerr').style.display='none';
  callExec(EXEC+'?dsbill=1&pw='+enc(PW)+'&callback=cb&t='+Date.now(), function(d){
    if(d&&d.ok){ CONTACTS=d.list||[]; document.getElementById('gate').style.display='none'; document.getElementById('main').style.display='block';
      var dt=new Date(); document.getElementById('thang').value=('0'+(dt.getMonth()+1)).slice(-2)+'-'+dt.getFullYear(); }
    else { document.getElementById('gerr').style.display='block'; }
  }, function(){ document.getElementById('gerr').style.display='block'; });
}
function findContact(fname){
  var f=String(fname||'').toLowerCase(), best=null;
  CONTACTS.forEach(function(c){ var p=String(c.phong||'').toLowerCase(); if(p && f.indexOf(p)>-1){ if(!best||p.length>String(best.phong).length) best=c; } });
  return best;
}
function mkMsg(c,thang,link){
  var vi='Kính gửi '+c.ten+', LUXHOME xin gửi hóa đơn tiền thuê căn hộ '+c.phong+' - tháng '+thang+'. Vui lòng xem hóa đơn và thanh toán giúp ạ: '+link+'. Trân trọng, LUXHOME.';
  var en='Dear '+c.ten+', LUXHOME sends you the rental invoice for apartment '+c.phong+' - '+thang+'. Please view your invoice and make the payment: '+link+'. Best regards, LUXHOME.';
  return vi+'\n\n'+en;
}
document.getElementById('file').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files); e.target.value='';
  var thang=document.getElementById('thang').value.trim()||'';
  fs.forEach(function(file){ handle(file,thang); });
});
function handle(file,thang){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mx=1600,w=im.width,h=im.height; if(w>mx||h>mx){ if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;} }
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
      up(file.name, cv.toDataURL('image/jpeg',0.85), thang);
    };
    im.onerror=function(){ up(file.name, r.result, thang); };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
function findByRoom(room){
  if(!room) return null;
  var r=String(room).toUpperCase().replace(/\s+/g,'');
  var best=null;
  CONTACTS.forEach(function(c){ var p=String(c.phong||'').toUpperCase().replace(/\s+/g,''); if(p && (p===r || r.indexOf(p)>-1 || p.indexOf(r)>-1)){ if(!best||p.length>String(best.phong).length) best=c; } });
  return best;
}
function up(fname, dataUrl, thang){
  var cFile=findContact(fname);                        // thử theo tên file trước
  var mt=fname.match(/([A-Za-z0-9]{1,4}-T\d{1,3})/i);
  var hint=cFile?cFile.phong:(mt?mt[1]:'đang đọc mã phòng…');
  var box=addRow(dataUrl, hint, cFile, null, null, thang, true);
  var uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  try{
    fetch(EXEC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body:'bill=upload&pw='+enc(PW)+'&thang='+enc(thang)+'&uid='+enc(uid)+'&img='+enc(dataUrl)});
  }catch(e){}
  poll(box, cFile, thang, uid, 0);
}
function poll(box, cFile, thang, uid, n){
  if(n>18){ fillRow(box, (cFile?cFile.phong:'?'), cFile, null, 'Tải lên quá lâu, thử lại', thang); return; }
  callExec(EXEC+'?getbill=1&pw='+enc(PW)+'&uid='+enc(uid)+'&callback=cb&t='+Date.now(), function(d){
    if(d && d.ok && !d.pending && d.link){
      var c=cFile || findByRoom(d.room);              // khớp theo tên file, nếu không có thì theo mã phòng OCR đọc được
      var room=c?c.phong:(d.room||'Không rõ');
      fillRow(box, room, c, d.link, null, thang);
    } else { setTimeout(function(){ poll(box, cFile, thang, uid, n+1); }, 1800); }
  }, function(){ setTimeout(function(){ poll(box, cFile, thang, uid, n+1); }, 1800); });
}
function addRow(img, room, c, link, err, thang, loading){
  var box=document.createElement('div'); box.className='row';
  var im=document.createElement('img'); im.src=img; box.appendChild(im);
  var info=document.createElement('div'); info.className='info'; info.id='info_'+Math.random().toString(36).slice(2,8);
  box.appendChild(info);
  var act=document.createElement('div'); act.className='act';
  box.appendChild(act);
  document.getElementById('list').appendChild(box);
  box._info=info; box._act=act;
  renderInto(box, room, c, link, err, thang, loading);
  return box;
}
function fillRow(box, room, c, link, err, thang){ renderInto(box, room, c, link, err, thang, false); }
function renderInto(box, room, c, link, err, thang, loading){
  var info=box._info, act=box._act;
  info.innerHTML='<div class="ph">'+esc(room)+(c?' <span class="nm">'+esc(c.ten)+' ('+esc(c.qt)+')</span>':'')+'</div>'+(link?'<div><a class="vlink" href="'+link+'" target="_blank" rel="noopener">xem bill ↗</a></div>':'');
  act.innerHTML='';
  if(loading){ act.innerHTML='<span class="load">⏳ đang tải lên…</span>'; return; }
  if(err){ act.innerHTML='<span class="warn">⚠️ '+esc(err)+'</span>'; return; }
  if(!c){ act.innerHTML='<span class="warn">⚠️ Không khớp mã phòng</span>'; return; }
  if(!c.sdt){ act.innerHTML='<span class="warn">⚠️ Chưa có SĐT</span>'; return; }
  if(!c.kenh){ act.innerHTML='<span class="warn">⚠️ Chưa chọn kênh</span>'; return; }
  var msg=mkMsg(c,thang||'',link||'');
  if(c.kenh==='wa'){ var a=document.createElement('a'); a.className='wa'; a.href='https://wa.me/'+waNum(c.sdt)+'?text='+encodeURIComponent(msg); a.target='_blank'; a.rel='noopener'; a.textContent='Gửi WhatsApp'; act.appendChild(a); }
  else if(c.kenh==='zalo'){ var a2=document.createElement('a'); a2.className='za'; a2.href='https://zalo.me/'+zaloNum(c.sdt); a2.target='_blank'; a2.rel='noopener'; a2.textContent='Gửi Zalo'; a2.onclick=function(){ cpy(msg); }; act.appendChild(a2); }
  else if(c.kenh==='wechat'){ var b=document.createElement('button'); b.className='wc'; b.textContent='WeChat (copy)'; b.onclick=function(){ cpy(msg); b.textContent='✓ Đã copy'; }; act.appendChild(b); }
}
document.getElementById('btnvao').onclick=vao;
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') vao(); });
</script>
</body>
</html>
