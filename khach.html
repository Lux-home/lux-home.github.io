<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXHOME · Chỉnh sửa thông tin khách thuê</title>
<meta name="theme-color" content="#0e7ba8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUXHOME">
<style>
  :root{ --bg:#eef3f4; --card:#fff; --fg:#13242a; --muted:#5f727a; --line:#e2eaec; --cyan:#0e7ba8; --cyan2:#28c3dd;
    --ok:#15803d; --okbg:#e7f6ec; --red:#b91c1c; --redbg:#fdeaea; --amb:#b45309; --ambbg:#fdf3e1; }
  @media (prefers-color-scheme:dark){:root{ --bg:#0c1518; --card:#13222a; --fg:#e8f1f3; --muted:#90a4ac; --line:#20333c; --okbg:#133222; --redbg:#2a1414; --ambbg:#2b2112; }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"Be Vietnam Pro",system-ui,sans-serif;line-height:1.4}
  .top{background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px}
  .top a.back{display:inline-block;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-weight:800;font-size:1.05rem;padding:9px 16px;border-radius:999px;margin-bottom:10px}
  .brand{font-size:1.4rem;font-weight:800;letter-spacing:1px;color:#ffd977}
  .brand small{display:block;font-size:.72rem;font-weight:600;letter-spacing:2px;color:#eafbff;margin-top:2px}
  .wrap{max-width:820px;margin:0 auto;padding:14px 12px 60px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--fg);width:100%}
  textarea{min-height:64px;resize:vertical}
  .bar input{flex:1 1 200px;width:auto} .bar select{flex:1 1 110px;width:auto}
  .btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;color:#fff;background:var(--cyan);white-space:nowrap}
  .btn.gh{background:transparent;color:var(--cyan);border:1.5px solid var(--cyan)}
  .btn.red{background:var(--red)} .btn.sm{padding:8px 11px;font-size:.85rem}
  .btn:disabled{opacity:.45;cursor:default}
  .sum{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;font-size:.8rem}
  .sum span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700}
  .room{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
  .rh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(14,123,168,.08);font-weight:800}
  .rh .n{margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:700}
  .g{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
  .g:active{background:rgba(14,123,168,.06)}
  .g .nm{font-weight:700} .g .sub{font-size:.8rem;color:var(--muted)}
  .g .go{margin-left:auto;color:var(--muted);font-size:1.2rem}
  .g.empty .nm{color:var(--muted);font-weight:600;font-style:italic}
  .tag{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 7px;border-radius:999px;margin:3px 4px 0 0}
  .t-red{background:var(--redbg);color:var(--red)} .t-amb{background:var(--ambbg);color:var(--amb)} .t-ok{background:var(--okbg);color:var(--ok)} .t-mut{background:rgba(135,149,160,.18);color:var(--muted)}
  .muted{color:var(--muted)} .hint{color:var(--muted);font-size:.82rem;margin:2px 0 10px}
  .warn{background:var(--ambbg);color:var(--amb);border-radius:12px;padding:12px;font-weight:700;margin-bottom:12px}
  /* màn hình sửa */
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
  .sheet.show{display:block}
  .shead{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
  .shead b{font-size:1.05rem;flex:1;line-height:1.2} .shead b small{display:block;font-size:.75rem;opacity:.85;font-weight:600}
  .shead button{border:0;background:rgba(255,255,255,.22);color:#fff;font:inherit;font-weight:800;padding:8px 14px;border-radius:999px;cursor:pointer}
  .form{max-width:820px;margin:0 auto;padding:12px 12px 90px}
  details.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
  details.sec summary{padding:13px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
  details.sec summary::-webkit-details-marker{display:none}
  details.sec summary::after{content:"▾";margin-left:auto;color:var(--muted)}
  details.sec[open] summary::after{content:"▴"}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
  .f{display:flex;flex-direction:column;gap:4px} .f.full{grid-column:1/-1}
  .f label{font-size:.74rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .f.chg input,.f.chg select,.f.chg textarea{border-color:var(--amb);box-shadow:0 0 0 2px rgba(180,83,9,.15)}
  .calc{grid-column:1/-1;background:rgba(14,123,168,.07);border-radius:11px;padding:10px 12px;font-size:.88rem;display:grid;grid-template-columns:1fr auto;gap:3px 10px}
  .calc b{text-align:right} .calc .tot{font-size:1rem;border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
  .act{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;justify-content:center;z-index:45}
  .act .btn{flex:1;max-width:300px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:var(--card);width:100%;max-width:440px;border-radius:18px;padding:18px}
  .modal h3{margin:0 0 8px}
  .chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:.92rem} .chk input{width:auto;margin-top:3px}
  .login{max-width:380px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
  .login h2{margin:0 0 6px;color:var(--cyan)} .login input{margin:12px 0} .login .btn{width:100%}
  .olist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:.88rem}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#13242a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;z-index:90;max-width:92%;pointer-events:none}
  .toast.show{opacity:1}
  .sync{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;border-radius:999px;padding:7px 12px;font-size:.8rem;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.2);display:none;cursor:pointer;border:0}
  .sync.show{display:block} .sync.w{background:#fff6dd;color:#8a5a00} .sync.ok{background:#e7f6ec;color:#15803d} .sync.err{background:#fdeaea;color:#b91c1c}
  .busy{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:95;display:none;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:20px}
  .busy.show{display:flex}
  @media (max-width:440px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="checkinout.html">← Check in - Check out</a>
  <div class="brand">LUXHOME<small>CHỈNH SỬA THÔNG TIN KHÁCH THUÊ</small></div>
</div>
<div class="wrap" id="main"><p class="muted">Đang tải…</p></div>

<div class="sheet" id="sheet">
  <div class="shead"><button onclick="closeSheet()">✕</button><b id="sTitle">Khách</b></div>
  <div class="form" id="sBody"></div>
  <div class="act" id="sAct"></div>
</div>

<div class="modal" id="modal"><div class="box" id="mBox"></div></div>
<div class="busy" id="busy"><div>⏳ <span id="busyT">Đang ghi vào file…</span><br><small style="font-weight:600;opacity:.85">(5–20 giây — đừng tắt app)</small></div></div>
<div class="toast" id="toast"></div>
<button class="sync" id="sync" onclick="syncClick()"></button>

<script src="canho-api.js"></script>
<script>
var PWKEY="luxAdminPw";
var ROWS=[], AT='', CUR=null, VIEW='list', FQ='', FT='', FF='';

/* Trường sửa được: [khoá, nhãn, loại, nhóm] — loại: t=chữ, d=ngày, n=số, m=tiền, s:… = chọn */
var FIELDS=[
  ['ten','Tên khách','t',1],['qt','Quốc tịch','s:VN|NN',1],['ns','Năm sinh','t',1],['gt','Giới tính','s:Nam|Nữ',1],
  ['cccd','CCCD','t',1],['hc','Hộ chiếu','t',1],['dc','Địa chỉ / Quốc gia','t',1,'full'],
  ['lh','Liên hệ (kênh)','s:Zalo|WhatsApp|WeChat',1],['sdt','Số điện thoại','t',1],['sale','SALE / môi giới','t',1,'full'],
  ['bd','Bắt đầu HĐ','d',2],['kt','Kết thúc HĐ','d',2],['lt','Hạn lưu trú (visa / tạm trú)','d',2,'full'],
  ['coc','Tiền cọc','m',2],['tp','Tiền phòng / tháng','m',2],['sn','Số người ở','n',2],['dck','Chỉ số điện check-in','n',2],
  ['nuoc','Đơn giá nước (người/tháng)','m',2],['bt','Phí bảo trì / dịch vụ (người/tháng)','m',2],['ttnp','Thanh toán khi nhận phòng','t',2,'full'],
  ['tnbd','Tiền thuê từ ngày','d',3],['tnkt','Tiền thuê đến ngày','d',3],['dvbd','Dịch vụ từ ngày','d',3],['dvkt','Dịch vụ đến ngày','d',3],
  ['dcu','Chỉ số điện cũ','n',3],['dmoi','Chỉ số điện mới','n',3],['gdien','Đơn giá điện (đ/kWh)','m',3],['khac','Tiền khác','m',3],['gc','Ghi chú','t',3,'full']
];
var GROUPS={1:'👤 Thông tin khách',2:'📄 Hợp đồng & lưu trú',3:'⚡ Chỉ số điện & tiền tháng'};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');}
function toast(m,ms){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},ms||2800);}
function busy(on,txt){ $('busy').classList.toggle('show',!!on); if(txt) $('busyT').textContent=txt; }
function pw(){try{return localStorage.getItem(PWKEY)||'';}catch(e){return '';}}
function digits(s){ s=String(s==null?'':s).trim(); if(/^-?\d+(\.\d+)?$/.test(s)) return s; var d=s.replace(/[^\d-]/g,''); return d; }
function money(s){ var d=digits(s); if(d===''||d==='-') return ''; var n=Number(d); return isNaN(n)?String(s):Math.round(n).toLocaleString('vi-VN'); }
// ngày: nhận "dd/mm/yyyy", "d/m/yyyy", "yyyy-mm-dd", "m/d/yyyy"(Excel kiểu Mỹ, khi ngày >12)
function pd(s){ s=String(s||'').trim(); var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/))){ var a=+m[1],b=+m[2]; if(b>12&&a<=12){var t=a;a=b;b=t;} return new Date(+m[3],b-1,a); }
  return null; }
function dmy(d){ return d?(('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()):''; }
function iso(d){ return d?(d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)):''; }
function daysLeft(s){ var d=pd(s); if(!d) return null; var t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function errMsg(d){ var e=d&&d.err; return e==='badpw'?'Sai mật khẩu hoặc đã bị tắt':e==='noperm'?'Chỉ Admin được dùng trang này':e==='busy'?'Máy chủ đang bận, thử lại sau ít giây':e==='changed'?(d.msg||'Dữ liệu đã đổi, tải lại'):e==='layout'?(d.msg||'Cấu trúc file đã đổi'):(d&&d.msg)||'Lỗi, thử lại'; }

/* ---------- ĐĂNG NHẬP ---------- */
function showLogin(msg){
  $('main').innerHTML='<div class="login"><h2>🔐 Admin</h2><div class="muted">Nhập mật khẩu Admin để xem / sửa thông tin khách thuê</div>'
    +'<input id="lp" type="password" placeholder="Mật khẩu Admin" autocomplete="current-password"><button class="btn" id="lb">Đăng nhập</button>'
    +(msg?'<div style="color:var(--red);font-weight:700;margin-top:10px">'+esc(msg)+'</div>':'')+'</div>';
  var go=function(){var v=$('lp').value.trim(); if(!v)return; $('lb').disabled=true; $('lb').textContent='Đang kiểm tra…';
    luxApi('login',{pw:v}).then(function(d){ if(d&&d.ok&&d.role==='admin'){ try{localStorage.setItem(PWKEY,v);}catch(e){} start(); } else showLogin(d&&d.ok?'Mật khẩu này không phải Admin':'Sai mật khẩu'); })
    .catch(function(){showLogin('Không kết nối được máy chủ');});};
  $('lb').onclick=go; $('lp').onkeydown=function(e){if(e.key==='Enter')go();}; $('lp').focus();
}
function start(){
  if(!window.LUX_CANHO_API){ $('main').innerHTML='<div class="warn">Chưa kết nối máy chủ.</div>'; return; }
  if(!pw()) return showLogin();
  load();
}
function load(silent){
  if(!silent) $('main').innerHTML='<p class="muted">⏳ Đang đọc file QUAN LY KHACH HANG… (5–15 giây)</p>';
  return luxApi('khlist',{pw:pw()}).then(function(d){
    if(!d||!d.ok){ if(d&&d.err==='badpw'){ try{localStorage.removeItem(PWKEY);}catch(e){} return showLogin('Mật khẩu đã đổi, đăng nhập lại'); }
      if(d&&d.err==='noperm'){ try{localStorage.removeItem(PWKEY);}catch(e){} return showLogin('Chỉ Admin được vào trang này'); }
      $('main').innerHTML='<div class="warn">'+esc(errMsg(d))+'</div><button class="btn" onclick="load()">Thử lại</button>'; return; }
    ROWS=d.rows; AT=d.at; render(); if(d.errors&&d.errors.length){ ERRS=d.errors; showSync(); }
  }).catch(function(){ $('main').innerHTML='<div class="warn">Không kết nối được máy chủ.</div><button class="btn" onclick="load()">Thử lại</button>'; });
}

/* ---------- DANH SÁCH ---------- */
function flags(r){
  var o=[]; if(!r.ten) return o;
  var h=daysLeft(r.kt), v=daysLeft(r.lt);
  if(h!==null){ if(h<0) o.push(['t-red','HĐ quá hạn '+(-h)+' ngày']); else if(h<=15) o.push(['t-amb','HĐ còn '+h+' ngày']); }
  if(v!==null){ if(v<0) o.push(['t-red','Lưu trú quá hạn '+(-v)+' ngày']); else if(v<=5) o.push(['t-amb','Lưu trú còn '+v+' ngày']); }
  if(String(r.qt).toUpperCase()==='NN' && !pd(r.lt)) o.push(['t-mut','Thiếu hạn lưu trú']);
  return o;
}
function render(){
  if(VIEW==='out') return renderOut();
  var toas={}; ROWS.forEach(function(r){ if(r.toa) toas[r.toa]=1; });
  var tl=Object.keys(toas).sort(function(a,b){return a.localeCompare(b,'vi',{numeric:true});});
  $('main').innerHTML='<div class="bar"><input id="q" placeholder="🔎 Tìm phòng, tên, hộ chiếu, CCCD, SĐT…" value="'+esc(FQ)+'">'
    +'<select id="ft"><option value="">Mọi tòa</option>'+tl.map(function(t){return '<option'+(t===FT?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select>'
    +'<select id="ff"><option value="">Tất cả</option><option value="warn"'+(FF==='warn'?' selected':'')+'>⚠️ Sắp/quá hạn</option><option value="empty"'+(FF==='empty'?' selected':'')+'>Dòng trống</option><option value="nn"'+(FF==='nn'?' selected':'')+'>Khách NN</option><option value="vn"'+(FF==='vn'?' selected':'')+'>Khách VN</option></select></div>'
    +'<div class="bar"><button class="btn gh sm" onclick="load()">🔄 Tải lại</button><button class="btn gh sm" onclick="exportX()">⬇️ Xuất Excel</button><button class="btn gh sm" onclick="VIEW=\'out\';render()">📋 Khách đã trả phòng</button></div>'
    +'<div class="sum" id="sum"></div><div id="list"></div><p class="hint">Dữ liệu đọc lúc '+esc(AT)+'. Bấm Lưu là xong ngay; máy chủ tự ghi vào file QUAN LY KHACH HANG.xlsm ở chế độ nền (có bản sao lưu) — xem nút trạng thái góc trên. <b>Đừng mở file trong Excel và sửa cùng lúc.</b></p>';
  $('q').oninput=function(){FQ=this.value;list();}; $('ft').onchange=function(){FT=this.value;list();}; $('ff').onchange=function(){FF=this.value;list();};
  list();
}
function list(){
  var q=norm(FQ).trim();
  var L=ROWS.filter(function(r){
    if(FT&&r.toa!==FT) return false;
    if(FF==='empty'&&r.ten) return false;
    if(FF==='warn'&&!flags(r).some(function(f){return f[0]!=='t-mut';})) return false;
    if(FF==='nn'&&String(r.qt).toUpperCase()!=='NN') return false;
    if(FF==='vn'&&String(r.qt).toUpperCase()!=='VN') return false;
    if(q&&norm([r.ma,r.ten,r.hc,r.cccd,r.sdt,r.sale,r.toa].join(' ')).replace(/\s+/g,' ').indexOf(q)<0) return false;
    return true;
  });
  var g=ROWS.filter(function(r){return r.ten;}), nn=g.filter(function(r){return String(r.qt).toUpperCase()==='NN';}).length;
  var w=g.filter(function(r){return flags(r).some(function(f){return f[0]==='t-red'||f[0]==='t-amb';});}).length;
  $('sum').innerHTML='<span>Khách: '+g.length+'</span><span>VN '+(g.length-nn)+' · NN '+nn+'</span><span style="color:var(--amb)">⚠️ '+w+'</span><span>Dòng trống: '+(ROWS.length-g.length)+'</span><span>Đang lọc: '+L.length+'</span>';
  var groups=[], idx={};
  L.forEach(function(r){ var k=r.ma||('?'+r.row); if(!(k in idx)){idx[k]=groups.length;groups.push({ma:r.ma,toa:r.toa,rows:[]});} groups[idx[k]].rows.push(r); });
  var more=groups.length>150; if(more) groups=groups.slice(0,150);
  $('list').innerHTML=groups.length?groups.map(function(gr){
    return '<div class="room"><div class="rh">🚪 '+esc(gr.ma||'(chưa có mã phòng)')+'<span class="n">'+gr.rows.filter(function(r){return r.ten;}).length+' khách</span></div>'
      +gr.rows.map(function(r){
        if(!r.ten) return '<div class="g empty" onclick="openG('+r.row+')"><div><div class="nm">Dòng trống (dòng '+r.row+')</div><div class="sub">Bấm để điền khách vào dòng này</div></div><div class="go">›</div></div>';
        var fl=flags(r);
        return '<div class="g" onclick="openG('+r.row+')"><div style="min-width:0"><div class="nm">'+esc(r.ten)+' <span class="tag t-mut">'+esc(r.qt||'?')+'</span></div>'
          +'<div class="sub">'+esc([r.hc||r.cccd, r.lh&&r.sdt?(r.lh+' '+r.sdt):r.sdt].filter(Boolean).join(' · '))+'</div>'
          +'<div class="sub">HĐ: '+esc(r.bd||'?')+' → '+esc(r.kt||'?')+(r.lt&&r.lt!=='-'?' · Lưu trú: '+esc(r.lt):'')+'</div>'
          +fl.map(function(f){return '<span class="tag '+f[0]+'">'+esc(f[1])+'</span>';}).join('')+'</div><div class="go">›</div></div>';
      }).join('')+'</div>';
  }).join('')+(more?'<p class="muted">Chỉ hiện 150 phòng đầu — dùng ô tìm / lọc tòa để thu hẹp.</p>':''):'<p class="muted">Không có khách phù hợp.</p>';
}

/* ---------- SỬA KHÁCH ---------- */
function fieldHtml(f,r){
  var k=f[0], lab=f[1], ty=f[2], cls='f'+(f[4]?' full':''), v=r[k]==null?'':String(r[k]), inp;
  if(ty.indexOf('s:')===0){ var ops=ty.slice(2).split('|'); var cur=v; var has=ops.some(function(o){return norm(o)===norm(cur);});
    inp='<select id="e_'+k+'"><option value=""></option>'+(cur&&!has?'<option selected>'+esc(cur)+'</option>':'')+ops.map(function(o){return '<option'+(norm(o)===norm(cur)?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>'; }
  else if(ty==='d'){ var d=pd(v); inp='<input type="date" id="e_'+k+'" value="'+(d?iso(d):'')+'">'+(v&&!d?'<div class="sub muted" style="font-size:.75rem">Đang ghi: "'+esc(v)+'"</div>':''); }
  else if(ty==='m'){ inp='<input id="e_'+k+'" inputmode="numeric" value="'+esc(money(v))+'">'; }
  else if(ty==='n'){ inp='<input id="e_'+k+'" inputmode="decimal" value="'+esc(digits(v)===''?v:v.replace(/,/g,''))+'">'; }
  else if(k==='gc'||k==='dc'){ inp='<textarea id="e_'+k+'">'+esc(v)+'</textarea>'; }
  else inp='<input id="e_'+k+'" value="'+esc(v)+'">';
  return '<div class="'+cls+'" id="w_'+k+'"><label>'+esc(lab)+'</label>'+inp+'</div>';
}
function curVal(k,ty){ var e=$('e_'+k); if(!e) return null; var v=e.value.trim();
  if(ty==='d'){ if(!v) return ''; var p=v.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
  if(ty==='m') return digits(v);
  return v; }
function origVal(r,k,ty){ var v=r[k]==null?'':String(r[k]).trim();
  if(ty==='d'){ var d=pd(v); return d?dmy(d):(v? '\u0000'+v : ''); }
  if(ty==='m') return digits(v);
  if(ty==='n') return v.replace(/,/g,'');
  return v; }
var INIT={};   // giá trị ban đầu của từng ô nhập (chỉ ô người dùng thật sự sửa mới tính là thay đổi)
function snapInit(){ INIT={}; FIELDS.forEach(function(f){ var c=curVal(f[0],f[2]); if(c!==null) INIT[f[0]]=c; }); }
function changes(){
  var out={};
  FIELDS.forEach(function(f){ var k=f[0], c=curVal(k,f[2]); if(c===null||!(k in INIT)) return; if(c!==INIT[k]) out[k]=c; });
  return out;
}
function markChanges(){ var ch=changes(); FIELDS.forEach(function(f){ var w=$('w_'+f[0]); if(w) w.classList.toggle('chg', f[0] in ch); });
  var n=Object.keys(ch).length, b=$('saveBtn'); if(b){ b.disabled=!n; b.textContent=n?('💾 Lưu '+n+' thay đổi'):'💾 Lưu'; } calc(); }
function num(id){ var e=$(id); return e?Number(digits(e.value))||0:0; }
function dval(id){ var e=$(id); if(!e||!e.value) return null; var p=e.value.split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000; }
function calc(){
  var el=$('calcBox'); if(!el) return;
  var sd=num('e_dmoi')-num('e_dcu'), td=sd*num('e_gdien'), q=num('e_sn');
  var dv1=dval('e_dvbd'), dv2=dval('e_dvkt'), tn1=dval('e_tnbd'), tn2=dval('e_tnkt');
  var ndv=(dv1!=null&&dv2!=null)?(dv2-dv1+1):0, ntn=(tn1!=null&&tn2!=null)?(tn2-tn1+1):0;
  var tnuoc=ndv/30*q*num('e_nuoc'), tdv=q*num('e_bt')*ndv/30, tthue=ntn/30*num('e_tp');
  var tong=Math.round((num('e_khac')+td+tnuoc+tdv+tthue)/1000)*1000;
  var f=function(x){return Math.round(x).toLocaleString('vi-VN');};
  el.innerHTML='<span>Số điện ('+f(num('e_dcu'))+' → '+f(num('e_dmoi'))+')</span><b>'+f(sd)+' kWh</b>'
    +'<span>Tiền điện</span><b>'+f(td)+'</b><span>Tiền nước ('+ndv+' ngày × '+q+' người)</span><b>'+f(tnuoc)+'</b>'
    +'<span>Tiền dịch vụ</span><b>'+f(tdv)+'</b><span>Tiền thuê căn hộ ('+ntn+' ngày)</span><b>'+f(tthue)+'</b>'
    +'<span>Tiền khác</span><b>'+f(num('e_khac'))+'</b><span class="tot">Tổng cộng (làm tròn nghìn)</span><b class="tot">'+f(tong)+' đ</b>';
}
function openG(row){
  var r=ROWS.find(function(x){return x.row===row;}); if(!r) return; CUR=r;
  $('sTitle').innerHTML=esc(r.ten||'Dòng trống')+'<small>Phòng '+esc(r.ma||'?')+' · dòng '+r.row+' trong file</small>';
  var html='';
  [1,2,3].forEach(function(gp){
    html+='<details class="sec"'+(gp===1||!r.ten?' open':'')+'><summary>'+GROUPS[gp]+'</summary><div class="grid">'
      +FIELDS.filter(function(f){return f[3]===gp;}).map(function(f){return fieldHtml(f,r);}).join('')
      +(gp===3?'<div class="calc" id="calcBox"></div><div class="f full hint" style="margin:0">Tính giống công thức trong file (cột AI–AN). Cột công thức trong file KHÔNG bị sửa.</div>':'')+'</div></details>';
  });
  if(r.ten) html+='<div style="margin-top:14px"><button class="btn red" style="width:100%" onclick="askOut()">🚪 Khách trả phòng (OUT)</button>'
    +'<div class="hint" style="margin-top:6px">Lưu thông tin khách vào danh sách "Khách đã trả phòng", rồi xoá trắng thông tin khách trong file và tô ĐỎ ô Tên khách — giữ mã phòng và chỉ số điện cho khách sau.</div></div>';
  $('sBody').innerHTML=html;
  $('sAct').innerHTML='<button class="btn gh" onclick="closeSheet()">Đóng</button><button class="btn" id="saveBtn" onclick="saveG()" disabled>💾 Lưu</button>';
  FIELDS.forEach(function(f){ var e=$('e_'+f[0]); if(!e) return; var h=function(){ if(f[2]==='m'){ var p=e.selectionStart, L=e.value.length; e.value=money(e.value); } markChanges(); };
    e.addEventListener('input',h); e.addEventListener('change',h); });
  snapInit(); markChanges();
  $('sheet').classList.add('show'); $('sheet').scrollTop=0;
}
function closeSheet(force){
  if(!force && CUR && Object.keys(changes()).length && !confirm('Có thay đổi chưa lưu. Đóng không lưu?')) return;
  $('sheet').classList.remove('show'); CUR=null;
}
function saveG(){
  var ch=changes(), n=Object.keys(ch).length; if(!n||!CUR) return;
  if(!CUR.ten && !ch.ten) return toast('Nhập tên khách trước');
  var r=CUR, b=$('saveBtn'); b.disabled=true; b.textContent='Đang lưu…';
  luxApi('khqueue',{pw:pw(),type:'save',row:r.row,expect:{ma:r.ma,ten:r.ten},fields:ch},true).then(function(d){
    if(!d||!d.ok){ b.disabled=false; b.textContent='💾 Lưu'; return toast(errMsg(d),5000); }
    FIELDS.forEach(function(f){ var k=f[0]; if(!(k in ch)) return; r[k]= f[2]==='m'? money(ch[k]) : ch[k]; });
    toast('✓ Đã lưu');
    PENDING++; kick(); openG(r.row);
  }).catch(function(){ b.disabled=false; b.textContent='💾 Lưu'; toast('Không kết nối được máy chủ — chưa lưu',5000); });
}
/* ---------- GHI NỀN VÀO FILE ---------- */
var PENDING=0, APPLYING=false, AGAIN=false, ERRS=[], LASTOK='';
function kick(){
  if(APPLYING){ AGAIN=true; showSync(); return; }
  APPLYING=true; AGAIN=false; showSync();
  luxApi('khapply',{pw:pw()},true,true).then(function(d){
    APPLYING=false;
    if(d&&d.ok){ if(d.applied||d.failed){ PENDING=Math.max(0,PENDING-(d.applied||0)-(d.failed||0)); }
      ERRS=d.errors||[]; if(!AGAIN) PENDING=0; LASTOK=new Date().toTimeString().slice(0,5);
      if(d.failed) toast('⚠️ '+d.failed+' thay đổi không ghi được vào file — bấm nút đỏ góc trên để xem',6000); }
    else if(d&&d.err==='busy'){ AGAIN=true; }
    else { toast('Chưa ghi được vào file ('+errMsg(d)+') — sẽ thử lại',5000); setTimeout(kick,15000); }
    if(AGAIN){ setTimeout(kick,1500); } showSync();
  }).catch(function(){ APPLYING=false; showSync(); setTimeout(kick,15000); });
}
function showSync(){
  var el=$('sync'); el.className='sync show ';
  if(APPLYING||PENDING>0||AGAIN){ el.className+='w'; el.textContent='⏳ Đang ghi vào file…'; return; }
  if(ERRS.length){ el.className+='err'; el.textContent='⚠️ '+ERRS.length+' thay đổi lỗi'; return; }
  if(LASTOK){ el.className+='ok'; el.textContent='✓ Đã ghi vào file '+LASTOK; return; }
  el.className='sync';
}
function syncClick(){
  if(!ERRS.length) return;
  $('mBox').innerHTML='<h3>⚠️ Thay đổi chưa ghi được</h3><div class="hint">Các thay đổi dưới đây KHÔNG được ghi vào file (thường do dòng đã bị đổi ở nơi khác). Tải lại danh sách rồi sửa lại.</div>'
    +ERRS.map(function(e){ return '<div class="olist"><b>'+esc(e.type==='out'?'OUT ':'Sửa ')+esc(e.ten||'(dòng trống)')+'</b> · '+esc(e.ma||'')+' · dòng '+e.row+'<div class="muted">'+esc(e.msg||'')+'</div>'
      +(e.fields?'<div class="muted" style="font-size:.78rem">'+esc(Object.keys(e.fields).map(function(k){var f=FIELDS.find(function(x){return x[0]===k;});return (f?f[1]:k)+': '+e.fields[k];}).join(' · '))+'</div>':'')+'</div>'; }).join('')
    +'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn gh" style="flex:1" onclick="closeM()">Đóng</button><button class="btn" style="flex:1" onclick="clearErr()">Đã hiểu — tải lại</button></div>';
  $('modal').classList.add('show');
}
function clearErr(){ closeM(); luxApi('khclearerr',{pw:pw()},true).then(function(){ ERRS=[]; showSync(); load(); }); }
window.addEventListener('pagehide',function(){ if(PENDING>0&&!APPLYING) luxApi('khapply',{pw:pw()},true,true); });
function askOut(){
  var r=CUR, same=ROWS.filter(function(x){return x.ma===r.ma && x.ten && x.row!==r.row;});
  $('mBox').innerHTML='<h3>🚪 '+esc(r.ten)+' trả phòng?</h3><div class="muted">Phòng '+esc(r.ma)+(same.length?' · còn '+same.length+' khách khác trong phòng':' · là khách cuối cùng của phòng')+'</div>'
    +'<div class="f" style="margin-top:12px"><label>Ghi chú (lý do, ngày đi…)</label><input id="o_note" placeholder="VD: hết HĐ, chuyển phòng…"></div>'
    +'<label class="chk"><input type="checkbox" id="o_open"'+(same.length?'':' checked')+'> Mở căn '+esc(String(r.ma).replace(/-/g,''))+' trên catalog (Đang có sẵn)</label>'
    +'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn gh" style="flex:1" onclick="closeM()">Huỷ</button><button class="btn red" style="flex:1" onclick="doOut()">Xác nhận OUT</button></div>';
  $('modal').classList.add('show');
}
function closeM(){ $('modal').classList.remove('show'); }
function doOut(){
  var r=CUR, note=$('o_note').value.trim(), op=$('o_open').checked; closeM();
  var snap=JSON.parse(JSON.stringify(r));
  luxApi('khqueue',{pw:pw(),type:'out',row:r.row,guest:snap,note:note,openUnit:op},true).then(function(d){
    if(!d||!d.ok) return toast(errMsg(d),5000);
    var keep={row:r.row,phong:r.phong,toa:r.toa,ma:r.ma,dcu:r.dcu,dmoi:r.dmoi,khac:r.khac,gc:r.gc,gdien:r.gdien};
    FIELDS.forEach(function(f){ if(!(f[0] in keep)) r[f[0]]=''; }); Object.assign(r,keep);
    closeSheet(true); list();
    toast('✓ Đã OUT '+snap.ten+(op?' · căn sẽ được mở trên catalog':''),3500);
    PENDING++; kick();
  }).catch(function(){ toast('Không kết nối được máy chủ — chưa OUT',5000); });
}

/* ---------- XUẤT EXCEL & DS ĐÃ OUT ---------- */
function exportX(){
  busy(true,'Đang tải file Excel mới nhất…');
  luxApi('khexport',{pw:pw()}).then(function(d){
    busy(false); if(!d||!d.ok) return toast(errMsg(d));
    var bin=atob(d.data), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:d.mime})), a=document.createElement('a');
    a.href=url; a.download=d.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(url);},4000);
    toast('✓ Đã tải '+d.name);
  }).catch(function(){ busy(false); toast('Không tải được file'); });
}
function renderOut(){
  $('main').innerHTML='<div class="bar"><button class="btn gh sm" onclick="VIEW=\'list\';render()">← Danh sách khách</button></div><p class="muted">Đang tải…</p>';
  luxApi('khoutlist',{pw:pw()}).then(function(d){
    if(!d||!d.ok){ $('main').innerHTML+='<div class="warn">'+esc(errMsg(d))+'</div>'; return; }
    var H=d.header||[], R=d.rows||[];
    $('main').innerHTML='<div class="bar"><button class="btn gh sm" onclick="VIEW=\'list\';render()">← Danh sách khách</button></div>'
      +'<p class="hint">Khách đã OUT qua app (mới nhất trước). Mỗi khách được lưu đầy đủ thông tin trước khi xoá khỏi file.</p>'
      +(R.length?R.map(function(x){ return '<div class="olist"><b>'+esc(x[3])+'</b> · phòng '+esc(x[2])+' <span class="muted">— OUT '+esc(x[0])+'</span><div class="muted">'
        +esc([x[5],x[8]||x[7],x[17]&&x[18]?x[17]+' '+x[18]:x[18],'HĐ '+(x[10]||'?')+' → '+(x[11]||'?')].filter(Boolean).join(' · '))+'</div>'+(x[20]?'<div>📝 '+esc(x[20])+'</div>':'')+'</div>'; }).join('')
      :'<p class="muted">Chưa có khách nào OUT qua app.</p>');
  }).catch(function(){ $('main').innerHTML+='<div class="warn">Không kết nối được máy chủ.</div>'; });
}

start();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
