<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUXHOME · Quản lý thanh toán</title>
<meta name="theme-color" content="#0e7ba8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUXHOME">
<style>
  :root{ --bg:#eef3f4; --card:#fff; --fg:#13242a; --muted:#5f727a; --line:#e2eaec; --cyan:#0e7ba8; --cyan2:#28c3dd; }
  @media (prefers-color-scheme:dark){:root{ --bg:#0c1518; --card:#13222a; --fg:#e8f1f3; --muted:#90a4ac; --line:#20333c; }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,"Be Vietnam Pro",system-ui,sans-serif;line-height:1.4}
  .top{background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 18px}
  .top a.back{display:inline-block;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-weight:800;font-size:1.05rem;padding:9px 16px;border-radius:999px;margin-bottom:10px}
  .brand{font-size:1.4rem;font-weight:800;letter-spacing:1px;color:#ffd977}
  .brand small{display:block;font-size:.72rem;font-weight:600;letter-spacing:2px;color:#eafbff;margin-top:2px}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 48px}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 14px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 2px 12px rgba(14,123,168,.10);transition:transform .08s}
  .item:active{transform:scale(.98)}
  .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;
    background:linear-gradient(135deg,var(--cyan2),var(--cyan));flex:0 0 auto}
  .nm{font-weight:800;font-size:1.05rem}
  .en{font-size:.74rem;color:var(--muted);font-weight:500}
  .ds{font-size:.84rem;color:var(--muted);margin-top:3px}
  .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <a class="back" id="backLink" href="index.html">← Trang chính</a>
  <div class="brand">LUXHOME<small>QUẢN LÝ THANH TOÁN</small></div>
</div>
<div class="wrap">
  <a class="item" id="lnkBill" href="bill.html">
    <div class="ic">🧾</div>
    <div><div class="nm">Gửi hóa đơn</div><div class="en">Send invoices</div>
      <div class="ds">Gửi bill tiền phòng cho khách</div></div>
    <div class="go">›</div>
  </a>
  <a class="item" id="lnkCongno" href="congno.html">
    <div class="ic">💰</div>
    <div><div class="nm">Theo dõi công nợ</div><div class="en">Debt &amp; payments</div>
      <div class="ds">Khách đã / chưa thanh toán</div></div>
    <div class="go">›</div>
  </a>
</div>
<script>
// Mở từ app nhân viên (nv.html gắn ?tok=...) -> nút quay lại về app nhân viên, giữ tok khi sang trang con
(function(){
  var qs = location.search || '';
  if (/[?&]tok=/.test(qs)) {
    document.getElementById('backLink').href = 'nv.html';
    document.getElementById('backLink').textContent = '← App nhân viên';
  }
  document.getElementById('lnkBill').href = 'bill.html' + qs;
  document.getElementById('lnkCongno').href = 'congno.html' + qs;
})();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
